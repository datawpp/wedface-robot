name: face-scan

on:
  schedule:
    - cron: '9,39 * * * *'      # har 30 minute khud
  workflow_dispatch:
  repository_dispatch:
    types: [wedface-scan]

concurrency:
  group: face-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache InsightFace model
        uses: actions/cache@v4
        with:
          path: ~/.insightface
          key: insightface-buffalo-s-v1

      - name: Install deps
        run: |
          python -m pip install -U pip setuptools wheel
          pip install "cython<3" "numpy==1.26.4"
          pip install -r requirements.txt

      - name: Run robot
        env:
          WF_BASE: ${{ vars.WF_BASE || 'https://wedface.in' }}
          WF_TOKEN: ${{ secrets.WF_TOKEN }}
        run: python scan.py
